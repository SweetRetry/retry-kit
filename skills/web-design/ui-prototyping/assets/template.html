<!doctype html>
<!--
  原型模板。复制为 index.html 后，只改 <main> 里的候选 section 和自己的脚本。

  候选：每个 section[data-prototype-component] 一个候选，id 唯一，data-label 是底部标签栏里的名字。
        两个以上候选时底部居中生成悬浮标签栏，一次只显示一个候选，数字键 1 到 9 也能切换；当前候选写进 URL hash，刷新后不变。
        只剩一个时标签栏自动移除。淘汰候选就删整个 section。
  外观：Basecoat（shadcn 风格，Tailwind v4）。class：btn[data-variant=outline|secondary|ghost|destructive][data-size=sm|lg|icon]、
        input、textarea、label、card、badge、table、alert、tabs、dropdown-menu、select、dialog、toaster。
        dialog 用原生 <dialog class="dialog">，showModal() / close()。
        下拉、选择、标签页、toast 由 Basecoat JS 驱动（含键盘与焦点），动态插入的也会自动初始化；
        标记结构见 https://basecoatui.com/components/ 。toast：document.getElementById('toaster').toast({category, title, description})。
  状态：Alpine（x-data、x-for、x-show、x-model、@click）。mock 数据与共用逻辑写一份，所有候选复用。
  取值：shadcn 变量在 :root / .dark 上（--primary、--background、--radius、--font-sans …），
        Basecoat 组件与 Tailwind utility（bg-primary、text-muted-foreground、rounded-lg）同时跟随；暗色给 html 加 class="dark"。
  动效：候选入场动画会影响判断时把 body 的 data-motion 设为 true；自定义动画遵守 prefers-reduced-motion。
-->
<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style type="text/tailwindcss">
      /* Basecoat 已带 preflight 与默认主题；这里只编译 utility，并把 shadcn 变量接到 utility 名上。 */
      @import "tailwindcss/theme" layer(theme);
      @import "tailwindcss/utilities" layer(utilities);

      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      @layer base {
        html {
          @apply scroll-smooth;
        }
        @media (prefers-reduced-motion: reduce) {
          html {
            scroll-behavior: auto;
          }
        }
      }

      /* 取值模式：在此覆盖变量，例如 :root { --primary: oklch(55% 0.2 250); --radius: 0.5rem; } */
    </style>
    <script defer src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
  </head>
  <body class="min-h-full bg-background text-foreground antialiased" data-motion="false">
    <main class="min-h-svh">
      <section id="component-a" data-prototype-component data-label="A" class="min-h-svh"></section>
      <section id="component-b" data-prototype-component data-label="B" class="min-h-svh"></section>
      <section id="component-c" data-prototype-component data-label="C" class="min-h-svh"></section>
    </main>

    <nav
      id="component-nav"
      role="tablist"
      aria-label="Components"
      class="fixed bottom-6 left-1/2 z-50 flex -translate-x-1/2 gap-1 rounded-full border border-border/60 bg-background/60 p-1 shadow-lg backdrop-blur-xl"
    ></nav>

    <div id="toaster" class="toaster"></div>

    <script type="module">
      const components = [...document.querySelectorAll("[data-prototype-component]")];
      const nav = document.querySelector("#component-nav");
      const motionAllowed = document.body.dataset.motion === "true" && !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const { animate } = motionAllowed ? await import("https://cdn.jsdelivr.net/npm/motion@13.1.1/+esm") : {};

      if (components.length < 2) {
        nav.remove();
        if (animate) animate(components, { opacity: [0, 1], y: [16, 0] }, { duration: 0.3 });
      } else {
        mountTabs();
      }

      function mountTabs() {
        document.querySelector("main").classList.add("pb-24");
        const idle = ["text-muted-foreground", "hover:text-foreground"];
        const active = ["bg-primary", "text-primary-foreground"];

        const tabs = components.map((component, i) => {
          const tab = document.createElement("button");
          tab.type = "button";
          tab.setAttribute("role", "tab");
          tab.title = String(i + 1);
          tab.textContent = component.dataset.label;
          tab.className = "rounded-full px-4 py-1.5 text-sm transition-colors";
          tab.addEventListener("click", () => show(component.id));
          component.setAttribute("role", "tabpanel");
          nav.append(tab);
          return tab;
        });

        function show(id) {
          components.forEach((component, i) => {
            const on = component.id === id;
            component.hidden = !on;
            tabs[i].setAttribute("aria-selected", String(on));
            active.forEach((c) => tabs[i].classList.toggle(c, on));
            idle.forEach((c) => tabs[i].classList.toggle(c, !on));
          });
          history.replaceState(null, "", `#${id}`);
          window.scrollTo(0, 0);
          if (animate) animate(document.getElementById(id), { opacity: [0, 1], y: [16, 0] }, { duration: 0.3 });
        }

        addEventListener("keydown", (event) => {
          if (event.metaKey || event.ctrlKey || event.altKey) return;
          if (event.target.closest?.("input, textarea, select, [contenteditable]")) return;
          const component = components[Number(event.key) - 1];
          if (component) show(component.id);
        });

        const fromHash = components.find((component) => `#${component.id}` === location.hash);
        show((fromHash ?? components[0]).id);
      }
    </script>
  </body>
</html>
