<!doctype html>
<html lang="en" class="h-full bg-stone-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style type="text/tailwindcss">
      @layer base {
        html {
          @apply scroll-smooth;
        }

        :focus-visible {
          @apply outline-2 outline-offset-2 outline-blue-600;
        }

        @media (prefers-reduced-motion: reduce) {
          html {
            scroll-behavior: auto;
          }
        }
      }
    </style>
  </head>
  <body class="min-h-full text-stone-950 antialiased" data-motion="false">
    <div class="grid min-h-svh grid-cols-[12rem_minmax(0,1fr)] md:grid-cols-[15rem_minmax(0,1fr)]">
      <aside class="sticky top-0 h-svh overflow-y-auto border-r border-stone-200 bg-white p-3 md:p-5">
        <nav id="component-nav" class="grid gap-1" aria-label="Components"></nav>
      </aside>

      <main class="min-w-0">
        <section id="component-a" data-prototype-component data-label="A" class="min-h-svh scroll-mt-0"></section>
        <section id="component-b" data-prototype-component data-label="B" class="min-h-svh scroll-mt-0"></section>
        <section id="component-c" data-prototype-component data-label="C" class="min-h-svh scroll-mt-0"></section>
      </main>
    </div>

    <script type="module">
      const components = [...document.querySelectorAll("[data-prototype-component]")];
      const nav = document.querySelector("#component-nav");

      components.forEach((component) => {
        const link = document.createElement("a");
        link.href = `#${component.id}`;
        link.dataset.target = component.id;
        link.textContent = component.dataset.label;
        link.className = "rounded-lg px-3 py-2 text-sm text-stone-600 hover:bg-stone-100 hover:text-stone-950";
        nav.append(link);
      });

      const links = [...nav.querySelectorAll("a")];
      const setActive = (id) => {
        links.forEach((link) => {
          const active = link.dataset.target === id;
          link.classList.toggle("bg-stone-950", active);
          link.classList.toggle("text-white", active);
          link.classList.toggle("text-stone-600", !active);
          link.classList.toggle("hover:bg-stone-100", !active);
          link.classList.toggle("hover:text-stone-950", !active);
          if (active) link.setAttribute("aria-current", "true");
          else link.removeAttribute("aria-current");
        });
      };

      const observer = new IntersectionObserver(
        (entries) => {
          const visible = entries
            .filter((entry) => entry.isIntersecting)
            .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
          if (visible) setActive(visible.target.id);
        },
        { threshold: [0.25, 0.5, 0.75] },
      );

      components.forEach((component) => observer.observe(component));
      if (components[0]) setActive(components[0].id);

      const motionAllowed = document.body.dataset.motion === "true" && !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (motionAllowed) {
        const { animate, stagger } = await import("https://cdn.jsdelivr.net/npm/motion@13.1.1/+esm");
        animate(components, { opacity: [0, 1], y: [16, 0] }, { duration: 0.3, delay: stagger(0.06) });
      }
    </script>
  </body>
</html>
