<body class="min-h-screen bg-stone-50 text-stone-800 antialiased">
  <div class="mx-auto max-w-[1680px] px-5 py-6 sm:px-8 lg:px-12">
    <noscript>请启用 JavaScript 查看任务看板，或请主控提供进度摘要。</noscript>
    <p id="error" role="alert" class="mb-4 hidden rounded-xl border border-red-200 bg-red-50 p-4 text-red-800"></p>
    <main id="app" class="hidden">
      <section aria-labelledby="board-title">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-baseline gap-3"><h1 id="board-title" class="text-lg font-semibold">执行看板</h1><span id="shown-count" class="text-xs text-stone-500" aria-live="polite"></span></div>

        </div>
        <div class="mb-4 flex gap-1" role="group" aria-label="看板视图"><button id="board-view" type="button" aria-pressed="true" class="rounded-lg bg-stone-800 px-4 py-2 text-sm text-white">任务看板</button><button id="graph-view" type="button" aria-pressed="false" class="rounded-lg px-4 py-2 text-sm text-stone-600">依赖关系</button></div>
        <div id="graph-panel" class="mb-4 hidden rounded-xl border border-stone-200 bg-white p-4"><p class="mb-4 text-xs text-stone-500">从左到右推进 · 连线表示前置任务 · 点击节点查看详情</p><div class="max-h-[560px] overflow-auto"><div id="graph" class="relative"></div></div></div>
        <div id="board" class="grid grid-cols-1 items-start gap-4 md:grid-cols-2 xl:grid-cols-5"></div>
      </section>
    </main>
  </div>
  <dialog id="detail" aria-labelledby="detail-title" class="m-auto max-h-[85vh] w-[calc(100%-2rem)] max-w-2xl overflow-y-auto rounded-2xl border border-stone-200 bg-white p-0 text-stone-800 shadow-2xl backdrop:bg-stone-950/30">
    <div class="sticky top-0 z-10 flex items-center justify-between border-b border-stone-100 bg-white px-6 py-4"><span id="detail-id" class="text-xs font-medium tracking-wide text-stone-500"></span><form method="dialog"><button class="rounded-lg px-3 py-1 text-sm text-stone-600 hover:bg-stone-100" aria-label="关闭任务详情">关闭 ×</button></form></div>
    <div id="detail-content" class="p-6"></div>
  </dialog>
  <!-- 主控只更新下方 JSON；界面和内嵌 Tailwind CSS 无需随汇报修改。
  delivery: {id, title, status: planned|active|accepted|blocked, acceptance}
  task: {id, title, summary, owner, delivery, status, dependencies: [任务id],
         next, startCondition, blocker: "", commit: "", verification, review,
         source: "01-phase-example.md", evidence: [{label, href}]}
  task.status: Todo|Implementing|Verifying|Reviewing|Ready|Integrated|Blocked
  decision: {question, impact, source: "issues.md"}；只记录确实需要用户裁决的事项。
  updatedAt: 含时区的 ISO 8601 时间。将 JSON 字符串中的 < 编码为 \u003c。
  -->
  <script id="board-data" type="application/json">{
  "title": "任务看板",
  "goal": "尚未初始化任务计划",
  "updatedAt": null,
  "revision": "尚未收到执行汇报",
  "overview": "00-overview.md",
  "deliveries": [],
  "tasks": [],
  "decisions": []
}</script>
  <script>
    'use strict';
    const labels = {Todo:'待开始', Implementing:'实现中', Verifying:'验证中', Reviewing:'审查中', Ready:'待集成', Integrated:'已集成', Blocked:'受阻'};
    const tones = {Todo:'bg-stone-100 text-stone-600', Implementing:'bg-blue-50 text-blue-700', Verifying:'bg-violet-50 text-violet-700', Reviewing:'bg-violet-50 text-violet-700', Ready:'bg-teal-50 text-teal-700', Integrated:'bg-teal-50 text-teal-700', Blocked:'bg-amber-50 text-amber-800'};
    const colors = {Todo:'bg-stone-300', Implementing:'bg-blue-500', Verifying:'bg-violet-400', Reviewing:'bg-violet-600', Ready:'bg-teal-400', Integrated:'bg-teal-700', Blocked:'bg-amber-500'};
    const columns = [{title:'待开始', states:['Todo']}, {title:'进行中', states:['Implementing']}, {title:'待确认', states:['Verifying','Reviewing','Ready']}, {title:'已集成', states:['Integrated']}, {title:'受阻', states:['Blocked']}];
    const $ = id => document.getElementById(id);
    const escape = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const badge = status => `<span class="inline-flex rounded-md px-2 py-1 text-xs font-medium ${tones[status]}">${labels[status]}</span>`;
    const field = (title, text) => `<div><dt class="mb-1 text-xs text-stone-500">${escape(title)}</dt><dd class="whitespace-pre-wrap break-words text-sm leading-6">${escape(text)}</dd></div>`;
    const safeLink = href => {
      if (!['file:', 'https:', 'http:'].includes(new URL(href, location.href).protocol)) throw new Error('不支持的文档链接');
      return href;
    };
    const link = (title, href) => `<a class="text-sm font-medium text-teal-700 underline-offset-4 hover:underline" href="${escape(safeLink(href))}">${escape(title)} ↗</a>`;
    try {
      const data = JSON.parse($('board-data').textContent);
      const tasks = new Map(data.tasks.map(task => [task.id, task]));
      const deliveries = new Map(data.deliveries.map(delivery => [delivery.id, delivery]));
      if (tasks.size !== data.tasks.length || deliveries.size !== data.deliveries.length) throw new Error('任务或交付目标编号重复');
      for (const task of data.tasks) {
        if (!Object.hasOwn(labels, task.status) || !deliveries.has(task.delivery)) throw new Error(`${task.id} 的状态或交付目标无效`);
        if (task.status === 'Blocked' && !task.blocker) throw new Error(`${task.id} 缺少阻塞原因`);
        if (task.dependencies.some(id => !tasks.has(id))) throw new Error(`${task.id} 引用了不存在的前置任务`);
        safeLink(task.source);
        for (const item of task.evidence) safeLink(item.href);
      }
      for (const item of data.decisions) safeLink(item.source);
      document.title = `${data.title} · 执行看板`;

      function showDetail(id) {
        const task = tasks.get(id);
        $('detail-id').textContent = task.id;
        const dependencyText = task.dependencies.length ? task.dependencies.map(id => `${id} · ${tasks.get(id).title}（${labels[tasks.get(id).status]}）`).join('\n') : '无前置任务';
        $('detail-content').innerHTML = `<div class="mb-3">${badge(task.status)}</div><h2 id="detail-title" class="text-2xl font-semibold tracking-tight">${escape(task.title)}</h2><p class="mt-3 text-sm leading-6 text-stone-600">${escape(task.summary)}</p><dl class="mt-6 grid gap-5 sm:grid-cols-2">${field('负责人',task.owner)}${field('交付目标',deliveries.get(task.delivery).title)}${field('下一步',task.next)}${field('开始条件',task.startCondition)}${field('前置任务',dependencyText)}${task.blocker ? field('阻塞原因',task.blocker) : ''}${field('验证结果',task.verification)}${field('审查结果',task.review)}${field('代码版本',task.commit || '尚无提交')}</dl><div class="mt-6 border-b border-stone-100 pt-4">${link('打开任务文档',task.source)}${task.evidence.length ? `<h3 class="mb-2 mt-4 text-xs text-stone-500">相关证据</h3><ul class="space-y-2">${task.evidence.map(item => `<li>${link(item.label,item.href)}</li>`).join('')}</ul>` : '<p class="mt-4 text-xs text-stone-500">尚未记录证据链接</p>'}</div>`;
        $('detail').showModal();
      }
      function renderBoard() {
        const filtered = data.tasks;
        $('shown-count').textContent = `${filtered.length} / ${data.tasks.length} 个任务`;
        $('board').innerHTML = columns.map(column => {
          const items = filtered.filter(task => column.states.includes(task.status));
          return `<section class="min-w-0 rounded-xl bg-stone-100/80 p-3"><h3 class="mb-4 flex items-center justify-between px-1 text-sm font-medium"><span>${column.title}</span><span class="rounded-md bg-white px-2 py-0.5 text-xs tabular-nums text-stone-500">${items.length}</span></h3><div class="space-y-3">${items.map(task => `<button type="button" data-task="${escape(task.id)}" class="block w-full rounded-xl border ${task.status === 'Blocked' ? 'border-amber-200' : 'border-stone-200'} bg-white p-4 text-left transition-shadow hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600"><div class="mb-3 flex flex-wrap items-center justify-between gap-2"><span class="text-xs font-medium text-stone-500">${escape(task.id)}</span>${badge(task.status)}</div><h4 class="break-words text-sm font-semibold leading-6">${escape(task.title)}</h4><p class="mt-2 break-words text-xs leading-5 text-stone-500">${escape(task.summary)}</p>${task.blocker ? `<p class="mt-3 rounded-lg bg-amber-50 px-2 py-1.5 text-xs leading-5 text-amber-900">${escape(task.blocker)}</p>` : ''}<p class="mt-3 break-words text-xs leading-5 text-stone-600">下一步 · ${escape(task.next)}</p>${task.dependencies.length ? `<p class="mt-2 text-xs leading-5 text-stone-500">依赖 ${escape(task.dependencies.join('、'))}</p>` : ''}<div class="mt-4 flex items-center justify-between gap-2 border-b border-stone-100 pt-3 text-xs text-stone-500"><span>${escape(task.owner)}</span><span aria-hidden="true">详情 ↗</span></div></button>`).join('') || `<p class="px-1 py-6 text-xs leading-5 text-stone-500">${data.tasks.length ? '当前没有此状态的任务' : '任务尚未拆分'}</p>`}</div></section>`;
        }).join('');
        for (const button of $('board').querySelectorAll('[data-task]')) button.addEventListener('click', () => showDetail(button.dataset.task));
      }
      const levels = new Map(), visiting = new Set();
      function level(id) {
        if (visiting.has(id)) throw new Error(`任务 ${id} 存在循环依赖`);
        if (!levels.has(id)) {
          visiting.add(id);
          levels.set(id, Math.max(-1, ...tasks.get(id).dependencies.map(level)) + 1);
          visiting.delete(id);
        }
        return levels.get(id);
      }
      const rows = new Map(), positions = new Map();
      for (const task of data.tasks) {
        const column = level(task.id), row = rows.get(column) || 0;
        positions.set(task.id, {x:column * 280 + 12, y:row * 126 + 12}); rows.set(column,row + 1);
      }
      function renderGraph() {
        const width = Math.max(280, (Math.max(-1,...levels.values()) + 1) * 280);
        const height = Math.max(100, Math.max(0,...rows.values()) * 126 + 12);
        $('graph').style.width = `${width}px`; $('graph').style.height = `${height}px`;
        const paths = data.tasks.flatMap(task => task.dependencies.map(id => {
          const from = positions.get(id), to = positions.get(task.id);
          return `<path d="M ${from.x + 228} ${from.y + 48} C ${from.x + 254} ${from.y + 48}, ${to.x - 26} ${to.y + 48}, ${to.x - 4} ${to.y + 48}" fill="none" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arrow)"/>`;
        })).join('');
        $('graph').innerHTML = data.tasks.length ? `<svg class="absolute inset-0" width="${width}" height="${height}" aria-hidden="true"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 Z" fill="#a8a29e"/></marker></defs>${paths}</svg>` + data.tasks.map(task => {
          const pos = positions.get(task.id);
          return `<button type="button" data-task="${escape(task.id)}" style="left:${pos.x}px;top:${pos.y}px;width:228px;min-height:96px" class="absolute rounded-xl border border-stone-200 bg-white p-3 text-left hover:border-teal-600 focus-visible:outline-2 focus-visible:outline-teal-600"><span class="flex items-center justify-between gap-2"><span class="text-xs text-stone-500">${escape(task.id)}</span>${badge(task.status)}</span><span class="mt-2 block truncate text-sm font-medium">${escape(task.title)}</span></button>`;
        }).join('') : '<p class="text-sm text-stone-500">任务尚未拆分，暂无依赖关系。</p>';
        for (const button of $('graph').querySelectorAll('[data-task]')) button.addEventListener('click', () => showDetail(button.dataset.task));
      }
      function switchView(graph) {
        $('graph-panel').classList.toggle('hidden',!graph); $('board').classList.toggle('hidden',graph);
        for (const [id,selected] of [['board-view',!graph],['graph-view',graph]]) {
          $(id).setAttribute('aria-pressed',String(selected));
          $(id).className = selected ? 'rounded-lg bg-stone-800 px-4 py-2 text-sm text-white' : 'rounded-lg px-4 py-2 text-sm text-stone-600';
        }

        $('shown-count').textContent = graph ? `全部 ${data.tasks.length} 个任务` : '';
        if (!graph) renderBoard();
      }
      renderGraph();
      $('board-view').addEventListener('click',() => switchView(false));
      $('graph-view').addEventListener('click',() => switchView(true));

      renderBoard();
      $('app').classList.remove('hidden');
    } catch (error) {
      $('error').textContent = `看板数据无法读取：${error.message}。请主控核对执行汇报并修正看板数据。`;
      $('error').classList.remove('hidden');
    }
  </script>
</body>
</html>
